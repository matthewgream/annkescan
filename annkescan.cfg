
# annkescan -- flag people, animals and vehicles in the clips annkepull archives, for annkeserv.
# Installed as /etc/default/annkescan; a per-host annkescan.<hostname>.cfg is used instead when present.

# where annkepull archives: <archive>/<camera>/<YYYYMMDD>/recording_<...>.mp4
archive=/opt/storage/camera
# <camera>-mask.png (all groups) or <camera>-mask-<group>[-and-<group>].png: white where things count; empty for none
masks=

# camera-<name>=<groups>: the cameras to work through, and what to flag on each (people, animals, vehicles)
#camera-front=people,animals
# tiles-<name>=<n>: search 640 px tiles of a frame scaled to n tiles wide: finds smaller things, takes about n times as long
#tiles-front=1

# screens=<dir>: result files (recording_<...>.json) copied here mark their detections as false positives;
# a later one of the same group on the same camera in the same place is ignored (see README)
screens=

# the detector: YOLOX-S, or YOLO26s for clips recorded from yolo26-from on (YYYYMMDDHHMMSS, the time in their
# names); empty for YOLOX throughout
yolo26-from=

# score (0..1) a detection needs to count
threshold=0.4
# only clips from the last <n> days; 0 for the whole archive
days=0
# seconds between looks for new clips (annkepull brings them every 6 hours, from 04:00)
rescan=3600

# once a day, at report-at (HH:MM, local; empty: whenever the clips are done), a report of the clips done since
# the last one (clips, length, and those with each group seen) goes to <mqtt-topic>/<YYYYMMDD> on mqtt-server
# (mqtt://host[:port], or mqtts://); empty for none
mqtt-server=
mqtt-topic=camera/detect
# after the morning's pull (04:00-04:30, done in some minutes)
report-at=06:00
